name: Database migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE to apply committed migrations
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply committed migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DIRECT_DATABASE_URL is not configured."
            exit 1
          fi
          npm run db:migrate
