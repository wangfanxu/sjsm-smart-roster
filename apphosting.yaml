# Firebase App Hosting runtime configuration. Secret values live in Cloud Secret Manager.
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  - variable: APP_ENV
    value: production
    availability:
      - RUNTIME

  - variable: DATABASE_URL
    secret: sjsm-smart-roster-database-url
    availability:
      - RUNTIME

  - variable: ASSISTANT_MODEL
    value: gemini-3.1-flash-lite
    availability:
      - RUNTIME

  - variable: GEMINI_API_KEY
    secret: sjsm-smart-roster-gemini-api-key
    availability:
      - RUNTIME

  - variable: ASSISTANT_CONFIRMATION_SECRET
    secret: sjsm-smart-roster-assistant-confirmation-secret
    availability:
      - RUNTIME

  - variable: NOTIFICATION_FROM_EMAIL
    value: notifications@sjsm-smart-roster.app
    availability:
      - RUNTIME

  - variable: RESEND_API_KEY
    secret: sjsm-smart-roster-resend-api-key
    availability:
      - RUNTIME

  # Kill switch for roster-published emails - flip to "false" to test
  # publishing against real member data without sending anything, then
  # flip back to "true" (or remove this line) and redeploy. Any value
  # other than the literal string "false" is treated as enabled.
  - variable: ROSTER_NOTIFICATIONS_ENABLED
    value: "false"
    availability:
      - RUNTIME

  # Firebase Web SDK config for the browser sign-in UI. Not secret - see
  # .env.example. Needs BUILD availability because Next.js inlines
  # NEXT_PUBLIC_* variables into the client bundle at build time, not just
  # runtime.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCWkzgozfVhtuUghhwGerZSMOD03-w4Jag
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: sjsm-smart-roster.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: sjsm-smart-roster
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:931004635367:web:070f5bb1bb444226106a42"
    availability:
      - BUILD
      - RUNTIME
