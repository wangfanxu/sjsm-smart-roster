# Firebase App Hosting runtime configuration. Secret values live in Cloud Secret Manager.
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  - variable: APP_ENV
    value: production
    availability:
      - RUNTIME

  - variable: DATABASE_URL
    secret: sjsm-smart-roster-database-url
    availability:
      - RUNTIME

  - variable: ASSISTANT_MODEL
    value: gemini-3.1-flash-lite
    availability:
      - RUNTIME

  - variable: GEMINI_API_KEY
    secret: sjsm-smart-roster-gemini-api-key
    availability:
      - RUNTIME

  - variable: ASSISTANT_CONFIRMATION_SECRET
    secret: sjsm-smart-roster-assistant-confirmation-secret
    availability:
      - RUNTIME

  - variable: NOTIFICATION_FROM_EMAIL
    value: notifications@sjsm-smart-roster.app
    availability:
      - RUNTIME

  - variable: RESEND_API_KEY
    secret: sjsm-smart-roster-resend-api-key
    availability:
      - RUNTIME
